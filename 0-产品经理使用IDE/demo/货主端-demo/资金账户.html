<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资金账户 - 货主端</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <style>
        :root { --el-color-primary: #2DA44E; --el-bg-color: #F5F7FA; --el-text-color-regular: #606266; --el-text-color-primary: #303133; }
        body { margin: 0; padding: 16px; background-color: var(--el-bg-color); font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif; font-size: 14px; color: var(--el-text-color-primary); }
        .content-card { background-color: #fff; border-radius: 4px; padding: 16px; height: calc(100vh - 32px); display: flex; flex-direction: column; box-sizing: border-box; overflow: auto; }

        /* 余额总览 */
        .overview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .overview-title { font-size: 16px; font-weight: bold; color: #303133; padding-left: 8px; border-left: 4px solid #2DA44E; }
        .wallet-card {
            background: linear-gradient(135deg, #2DA44E 0%, #24833e 100%);
            border-radius: 8px; color: #fff; padding: 18px 20px; min-height: 88px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .wallet-card .entity { font-size: 14px; opacity: 0.9; }
        .wallet-card .currency { font-size: 12px; opacity: 0.7; margin-top: 2px; }
        .wallet-card .balance { font-size: 22px; font-weight: bold; margin-top: 10px; }

        /* 搜索区 */
        .search-area { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }

        .btn-search-primary { background-color: #2DA44E !important; border-color: #2DA44E !important; color: #FFFFFF !important; }
        .btn-search-reset { background-color: #FFFFFF !important; border-color: #DCDFE6 !important; color: #000000 !important; }

        .el-table th.el-table__cell { background-color: #FAFAFA; color: #303133; font-weight: 500; }
        .pagination-area { margin-top: 16px; display: flex; justify-content: flex-end; }

        .amount-in { color: #67C23A; font-weight: 500; }
        .amount-out { color: #F56C6C; font-weight: 500; }

        .section-title {
            font-size: 15px; font-weight: bold; color: #303133; margin-bottom: 16px; padding-bottom: 8px;
            border-bottom: 1px solid #E4E7ED; display: flex; align-items: center;
        }
        .section-title::before { content: ''; display: inline-block; width: 4px; height: 14px; background-color: #2DA44E; margin-right: 8px; border-radius: 2px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="content-card">
            <!-- 余额总览 -->
            <div class="overview-header">
                <span class="overview-title">账户余额</span>
                <el-button type="primary" @click="openRecharge">
                    <el-icon style="margin-right: 4px;"><Plus /></el-icon>充值
                </el-button>
            </div>
            <el-row :gutter="16">
                <el-col :span="6" v-for="w in wallets" :key="w.id" style="margin-bottom: 16px;">
                    <div class="wallet-card">
                        <div>
                            <div class="entity">{{ w.entityName }}</div>
                            <div class="currency">{{ currencyName(w.currency) }}</div>
                        </div>
                        <div class="balance">{{ currencySymbol(w.currency) }}{{ formatMoney(w.balance) }}</div>
                    </div>
                </el-col>
            </el-row>

            <!-- 流水 / 充值记录 -->
            <el-tabs v-model="activeTab">
                <el-tab-pane label="资金流水" name="flow">
                    <div class="search-area">
                        <el-select v-model="flowSearch.type" placeholder="流水类型" clearable style="width: 160px;">
                            <el-option v-for="t in flowTypes" :key="t" :label="t" :value="t"></el-option>
                        </el-select>
                        <el-select v-model="flowSearch.currency" placeholder="币种" clearable style="width: 140px;">
                            <el-option v-for="c in currencyOptions" :key="c" :label="currencyName(c)" :value="c"></el-option>
                        </el-select>
                        <el-button class="btn-search-primary" @click="handleFlowSearch">
                            <el-icon style="margin-right: 4px;"><Search /></el-icon>查询
                        </el-button>
                        <el-button class="btn-search-reset" @click="resetFlowSearch">
                            <el-icon style="margin-right: 4px;"><RefreshRight /></el-icon>重置
                        </el-button>
                    </div>
                    <el-table :data="filteredFlows" border style="width: 100%">
                        <el-table-column prop="time" label="时间" min-width="150"></el-table-column>
                        <el-table-column prop="type" label="流水类型" min-width="110" align="center">
                            <template #default="scope">
                                <el-tag :type="flowTypeTag(scope.row.type)" size="small">{{ scope.row.type }}</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="entityName" label="主体" min-width="110"></el-table-column>
                        <el-table-column prop="currency" label="币种" min-width="80" align="center">
                            <template #default="scope">{{ currencyName(scope.row.currency) }}</template>
                        </el-table-column>
                        <el-table-column label="变动金额" min-width="120" align="right">
                            <template #default="scope">
                                <span :class="scope.row.amount >= 0 ? 'amount-in' : 'amount-out'">
                                    {{ scope.row.amount >= 0 ? '+' : '' }}{{ currencySymbol(scope.row.currency) }}{{ formatMoney(scope.row.amount) }}
                                </span>
                            </template>
                        </el-table-column>
                        <el-table-column label="变动后余额" min-width="120" align="right">
                            <template #default="scope">
                                {{ currencySymbol(scope.row.currency) }}{{ formatMoney(scope.row.balance) }}
                            </template>
                        </el-table-column>
                    </el-table>
                    <div class="pagination-area">
                        <el-pagination background layout="total, prev, pager, next" :total="filteredFlows.length"></el-pagination>
                    </div>
                </el-tab-pane>

                <el-tab-pane :label="'充值记录 (' + rechargeRecords.length + ')'" name="recharge">
                    <el-table :data="rechargeRecords" border style="width: 100%">
                        <el-table-column prop="applyNo" label="充值单号" min-width="140"></el-table-column>
                        <el-table-column prop="time" label="申请时间" min-width="150"></el-table-column>
                        <el-table-column prop="entityName" label="主体" min-width="110"></el-table-column>
                        <el-table-column prop="currency" label="币种" min-width="80" align="center">
                            <template #default="scope">{{ currencyName(scope.row.currency) }}</template>
                        </el-table-column>
                        <el-table-column label="充值金额" min-width="120" align="right">
                            <template #default="scope">
                                {{ currencySymbol(scope.row.currency) }}{{ formatMoney(scope.row.amount) }}
                            </template>
                        </el-table-column>
                        <el-table-column prop="bankAccount" label="打款账户" min-width="200" show-overflow-tooltip></el-table-column>
                        <el-table-column prop="status" label="状态" min-width="90" align="center">
                            <template #default="scope">
                                <el-tag :type="scope.row.status === '已通过' ? 'success' : (scope.row.status === '待审核' ? 'warning' : 'danger')" size="small">{{ scope.row.status }}</el-tag>
                            </template>
                        </el-table-column>
                    </el-table>
                </el-tab-pane>
            </el-tabs>
        </div>

        <!-- 充值弹窗 -->
        <el-dialog v-model="rechargeVisible" title="充值" width="620px" destroy-on-close>
            <el-form ref="rechargeFormRef" :model="rechargeForm" :rules="rechargeRules" label-position="top">
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="充值主体" prop="entityName">
                            <el-select v-model="rechargeForm.entityName" placeholder="请选择主体" style="width: 100%" @change="onRechargeEntityChange">
                                <el-option v-for="e in entities" :key="e" :label="e" :value="e"></el-option>
                            </el-select>
                        </el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="充值币种" prop="currency">
                            <el-select v-model="rechargeForm.currency" placeholder="请选择币种" style="width: 100%" @change="onRechargeCurrencyChange">
                                <el-option v-for="c in currencyOptions" :key="c" :label="currencyName(c)" :value="c"></el-option>
                            </el-select>
                        </el-form-item>
                    </el-col>
                </el-row>
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="充值金额" prop="amount">
                            <el-input-number v-model="rechargeForm.amount" :min="0.01" :precision="2" :step="100" style="width: 100%" :controls="false" placeholder="请输入金额"></el-input-number>
                        </el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="打款账户" prop="bankAccountId">
                            <el-select v-model="rechargeForm.bankAccountId" placeholder="请选择打款账户" style="width: 100%" :disabled="!rechargeForm.entityName || !rechargeForm.currency">
                                <el-option v-for="b in availableBankAccounts" :key="b.id" :label="b.name" :value="b.id"></el-option>
                            </el-select>
                        </el-form-item>
                    </el-col>
                </el-row>
                <el-form-item label="打款凭证" prop="voucher">
                    <el-upload
                        action="#"
                        :auto-upload="false"
                        :limit="1"
                        :on-change="onVoucherChange"
                        :on-remove="onVoucherRemove"
                        accept="image/*,.pdf">
                        <el-button type="primary" plain>
                            <el-icon style="margin-right: 4px;"><Upload /></el-icon>上传打款凭证
                        </el-button>
                        <template #tip>
                            <div class="el-upload__tip">请上传银行转账回单截图或 PDF，单个文件不超过 5MB</div>
                        </template>
                    </el-upload>
                </el-form-item>
                <div style="background: #f8f9fa; border-radius: 4px; padding: 12px 16px; color: #909399; font-size: 13px; line-height: 1.6;">
                    温馨提示：提交后财务将线下核对银行流水，审核通过后资金入账到对应钱包。审核通过前不会增加钱包余额。
                </div>
            </el-form>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="rechargeVisible = false">取消</el-button>
                    <el-button type="primary" @click="submitRecharge">提交充值申请</el-button>
                </span>
            </template>
        </el-dialog>
    </div>

    <script>
        const { createApp, ref, reactive, computed } = Vue;
        const { ElMessage } = ElementPlus;

        const app = createApp({
            setup() {
                // === 币种/主体基础数据 ===
                const currencyMap = {
                    'CNY': { symbol: '¥', name: '人民币' },
                    'USD': { symbol: '$', name: '美元' },
                    'HKD': { symbol: 'HK$', name: '港币' },
                    'EUR': { symbol: '€', name: '欧元' }
                };
                const currencyOptions = ['CNY', 'USD', 'HKD', 'EUR'];
                const currencySymbol = (c) => currencyMap[c] ? currencyMap[c].symbol : c;
                const currencyName = (c) => currencyMap[c] ? currencyMap[c].name : c;
                const formatMoney = (val) => Number(val).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                const entities = ['广州飞点', '深圳飞点', '广东飞点', '香港富利顿'];

                // === 钱包余额（客户×主体×币种） ===
                const wallets = reactive([
                    { id: 1, entityName: '广州飞点', currency: 'CNY', balance: 3719.50 },
                    { id: 2, entityName: '广州飞点', currency: 'USD', balance: 1200.00 },
                    { id: 3, entityName: '深圳飞点', currency: 'CNY', balance: 3200.00 },
                    { id: 4, entityName: '广东飞点', currency: 'CNY', balance: 800.00 },
                    { id: 5, entityName: '香港富利顿', currency: 'HKD', balance: 15000.00 }
                ]);

                // === 我方银行账户（充值时选择） ===
                const bankAccounts = [
                    { id: 1, entityName: '广州飞点', currency: 'CNY', name: '广州飞点-招商银行深圳分行(7559 1234 5678)' },
                    { id: 2, entityName: '广州飞点', currency: 'USD', name: '广州飞点-中国银行美元户(6217 8888 6666)' },
                    { id: 3, entityName: '深圳飞点', currency: 'CNY', name: '深圳飞点-招商银行(7559 2222 3333)' },
                    { id: 4, entityName: '广东飞点', currency: 'CNY', name: '广东飞点-工商银行(4000 1111 2222)' },
                    { id: 5, entityName: '香港富利顿', currency: 'HKD', name: '香港富利顿-汇丰银行(HSBC 123-456-789)' }
                ];

                // === 资金流水 ===
                const flowTypes = ['充值', '充值退回', '提现', '账单核销', '账单核销撤销', '转汇'];
                const flowSearch = reactive({ type: '', currency: '' });

                const allFlows = [
                    { time: '2026-08-27 10:25', type: '充值', entityName: '广州飞点', currency: 'CNY', amount: 5000.00, balance: 5000.00 },
                    { time: '2026-08-26 09:30', type: '账单核销', entityName: '广州飞点', currency: 'CNY', amount: -1280.50, balance: 3719.50 },
                    { time: '2026-08-25 14:12', type: '充值', entityName: '深圳飞点', currency: 'CNY', amount: 3200.00, balance: 3200.00 },
                    { time: '2026-08-24 10:00', type: '转汇', entityName: '广州飞点', currency: 'USD', amount: 1200.00, balance: 1200.00 },
                    { time: '2026-08-22 17:00', type: '充值', entityName: '香港富利顿', currency: 'HKD', amount: 15000.00, balance: 15000.00 },
                    { time: '2026-08-20 11:00', type: '提现', entityName: '广州飞点', currency: 'CNY', amount: -500.00, balance: 4219.50 }
                ];

                const filteredFlows = computed(() => {
                    let data = allFlows;
                    if (flowSearch.type) data = data.filter(item => item.type === flowSearch.type);
                    if (flowSearch.currency) data = data.filter(item => item.currency === flowSearch.currency);
                    return data;
                });

                const flowTypeTag = (type) => {
                    const map = { '充值': 'success', '充值退回': 'info', '提现': 'warning', '账单核销': 'danger', '账单核销撤销': 'success', '转汇': 'primary' };
                    return map[type] || 'info';
                };
                const handleFlowSearch = () => { ElMessage.success('执行查询'); };
                const resetFlowSearch = () => { flowSearch.type = ''; flowSearch.currency = ''; };

                // === 充值记录 ===
                const rechargeRecords = reactive([
                    { applyNo: 'FD20260827001', time: '2026-08-27 10:23', entityName: '广州飞点', currency: 'CNY', amount: 5000.00, bankAccount: '广州飞点-招商银行深圳分行(7559 1234 5678)', status: '已通过' },
                    { applyNo: 'FD20260825002', time: '2026-08-25 14:10', entityName: '深圳飞点', currency: 'CNY', amount: 3200.00, bankAccount: '深圳飞点-招商银行(7559 2222 3333)', status: '已通过' },
                    { applyNo: 'FD20260824003', time: '2026-08-24 09:45', entityName: '香港富利顿', currency: 'HKD', amount: 15000.00, bankAccount: '香港富利顿-汇丰银行(HSBC 123-456-789)', status: '已通过' },
                    { applyNo: 'FD20260822004', time: '2026-08-22 16:30', entityName: '广州飞点', currency: 'USD', amount: 1200.00, bankAccount: '广州飞点-中国银行美元户(6217 8888 6666)', status: '已通过' }
                ]);

                // === 充值弹窗 ===
                const rechargeVisible = ref(false);
                const rechargeFormRef = ref(null);
                const voucherList = ref([]);
                const rechargeForm = reactive({
                    entityName: '',
                    currency: '',
                    amount: null,
                    bankAccountId: null,
                    voucher: ''
                });
                const rechargeRules = {
                    entityName: [{ required: true, message: '请选择充值主体', trigger: 'change' }],
                    currency: [{ required: true, message: '请选择充值币种', trigger: 'change' }],
                    amount: [{ required: true, message: '请输入充值金额', trigger: 'blur' }],
                    bankAccountId: [{ required: true, message: '请选择打款账户', trigger: 'change' }],
                    voucher: [{ required: true, message: '请上传打款凭证', trigger: 'change' }]
                };

                const availableBankAccounts = computed(() => {
                    return bankAccounts.filter(a => a.entityName === rechargeForm.entityName && a.currency === rechargeForm.currency);
                });

                const onRechargeEntityChange = () => { rechargeForm.bankAccountId = null; };
                const onRechargeCurrencyChange = () => { rechargeForm.bankAccountId = null; };
                const onVoucherChange = (file) => {
                    rechargeForm.voucher = file.name;
                };
                const onVoucherRemove = () => {
                    rechargeForm.voucher = '';
                };

                const openRecharge = () => {
                    rechargeForm.entityName = '';
                    rechargeForm.currency = '';
                    rechargeForm.amount = null;
                    rechargeForm.bankAccountId = null;
                    rechargeForm.voucher = '';
                    voucherList.value = [];
                    rechargeVisible.value = true;
                };

                const submitRecharge = () => {
                    if (!rechargeForm.entityName || !rechargeForm.currency || !rechargeForm.amount || !rechargeForm.bankAccountId || !rechargeForm.voucher) {
                        ElMessage.warning('请填写完整的充值信息并上传凭证');
                        return;
                    }
                    const bank = bankAccounts.find(b => b.id === rechargeForm.bankAccountId);
                    const now = new Date();
                    const pad = (n) => String(n).padStart(2, '0');
                    const timeStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
                    const seq = String(rechargeRecords.length + 1).padStart(3, '0');
                    const dateStr = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
                    rechargeRecords.unshift({
                        applyNo: `FD${dateStr}${seq}`,
                        time: timeStr,
                        entityName: rechargeForm.entityName,
                        currency: rechargeForm.currency,
                        amount: rechargeForm.amount,
                        bankAccount: bank ? bank.name : '',
                        status: '待审核'
                    });
                    ElMessage.success('充值申请已提交，等待财务审核');
                    rechargeVisible.value = false;
                    activeTab.value = 'recharge';
                };

                const activeTab = ref('flow');

                return {
                    activeTab, wallets, currencyOptions, entities,
                    currencySymbol, currencyName, formatMoney,
                    flowTypes, flowSearch, filteredFlows, flowTypeTag,
                    handleFlowSearch, resetFlowSearch,
                    rechargeRecords,
                    rechargeVisible, rechargeFormRef, rechargeForm, rechargeRules,
                    voucherList, availableBankAccounts,
                    onRechargeEntityChange, onRechargeCurrencyChange,
                    onVoucherChange, onVoucherRemove,
                    openRecharge, submitRecharge
                };
            }
        });

        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
