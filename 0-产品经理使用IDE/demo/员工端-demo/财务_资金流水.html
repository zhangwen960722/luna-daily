<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资金流水 - 员工端</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <style>
        :root { --el-color-primary: #2DA44E; --el-bg-color: #F5F7FA; --el-text-color-regular: #606266; --el-text-color-primary: #303133; }
        body { margin: 0; padding: 16px; background-color: var(--el-bg-color); font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif; font-size: 14px; color: var(--el-text-color-primary); }
        .content-card { background-color: #fff; border-radius: 4px; padding: 16px; height: calc(100vh - 32px); display: flex; flex-direction: column; box-sizing: border-box; }

        .search-area { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
        .btn-search-primary { background-color: #2DA44E !important; border-color: #2DA44E !important; color: #FFFFFF !important; }
        .btn-search-reset { background-color: #FFFFFF !important; border-color: #DCDFE6 !important; color: #000000 !important; }
        .el-table th.el-table__cell { background-color: #FAFAFA; color: #303133; font-weight: 500; }
        .pagination-area { margin-top: 16px; display: flex; justify-content: flex-end; }
        .bill-link { color: #409EFF; cursor: pointer; }
        .bill-link:hover { text-decoration: underline; }

        .amount-in { color: #67C23A; font-weight: 500; }
        .amount-out { color: #F56C6C; font-weight: 500; }
    </style>
</head>
<body>
    <div id="app">
        <div class="content-card">
            <div class="search-area" style="flex-wrap: nowrap;">
                <div style="display: flex; flex-wrap: wrap; gap: 16px; flex: 1;">
                    <el-input v-model="searchForm.customerName" placeholder="客户名称" clearable style="width: 200px;"></el-input>
                    <el-select v-model="searchForm.entityName" placeholder="主体" clearable style="width: 140px;">
                        <el-option v-for="e in entities" :key="e" :label="e" :value="e"></el-option>
                    </el-select>
                    <el-select v-model="searchForm.currency" placeholder="币种" clearable style="width: 130px;">
                        <el-option v-for="c in currencyOptions" :key="c" :label="currencyName(c)" :value="c"></el-option>
                    </el-select>
                    <template v-if="searchExpanded">
                        <el-select v-model="searchForm.flowType" placeholder="流水类型" clearable style="width: 140px;">
                            <el-option v-for="t in flowTypes" :key="t" :label="t" :value="t"></el-option>
                        </el-select>
                        <el-date-picker
                            v-model="searchForm.dateRange"
                            type="daterange"
                            value-format="YYYY-MM-DD"
                            range-separator="至"
                            start-placeholder="开始日期"
                            end-placeholder="结束日期"
                            style="width: 260px;">
                        </el-date-picker>
                    </template>
                </div>
                <div style="display: flex; gap: 12px; flex-shrink: 0;">
                    <el-button class="btn-search-primary" @click="handleSearch">
                        <el-icon style="margin-right: 4px;"><zoom-in></zoom-in></el-icon>查询
                    </el-button>
                    <el-button class="btn-search-reset" @click="resetSearch">
                        <el-icon style="margin-right: 4px;"><refresh-right></refresh-right></el-icon>重置
                    </el-button>
                    <el-button @click="searchExpanded = !searchExpanded">
                        <el-icon v-if="searchExpanded" style="margin-right: 4px;"><arrow-up></arrow-up></el-icon>
                        <el-icon v-else style="margin-right: 4px;"><arrow-down></arrow-down></el-icon>{{ searchExpanded ? '收起' : '更多' }}
                    </el-button>
                    <el-button @click="handleExport">
                        <el-icon style="margin-right: 4px;"><Download /></el-icon>导出
                    </el-button>
                </div>
            </div>

            <el-table :data="filteredFlows" border style="width: 100%">
                <el-table-column prop="time" label="流水时间" min-width="150"></el-table-column>
                <el-table-column prop="customerName" label="客户" min-width="190" show-overflow-tooltip></el-table-column>
                <el-table-column prop="entityName" label="账户主体" min-width="110"></el-table-column>
                <el-table-column prop="currency" label="币种" min-width="80" align="center">
                    <template #default="scope">{{ currencyName(scope.row.currency) }}</template>
                </el-table-column>
                <el-table-column label="账户名称" min-width="130">
                    <template #default="scope">{{ accountNameOf(scope.row) }}</template>
                </el-table-column>
                <el-table-column prop="flowType" label="流水类型" min-width="110" align="center">
                    <template #default="scope">
                        <el-tooltip :disabled="scope.row.flowType !== '赔付入账'" content="贷记单结转（我司应付客户）：入客户钱包后即终态、不可撤销；如需冲正请在运单侧新增反向流水、于下一期账单抵扣" placement="top">
                        <el-tag :type="flowTypeTag(scope.row.flowType)" size="small">{{ scope.row.flowType }}</el-tag>
                    </el-tooltip>
                    <el-tag v-if="scope.row.status === '已撤销'" type="info" size="small" style="margin-left: 4px;">已撤销</el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="变动金额" min-width="120" align="right">
                    <template #default="scope">
                        <span :class="scope.row.amount >= 0 ? 'amount-in' : 'amount-out'">
                            {{ scope.row.amount >= 0 ? '+' : '' }}{{ currencySymbol(scope.row.currency) }}{{ formatMoney(scope.row.amount) }}
                        </span>
                    </template>
                </el-table-column>
                <el-table-column label="变动后余额" min-width="120" align="right">
                    <template #default="scope">{{ currencySymbol(scope.row.currency) }}{{ formatMoney(scope.row.balanceAfter) }}</template>
                </el-table-column>
                <el-table-column prop="operator" label="操作人" min-width="110"></el-table-column>
                <el-table-column label="关联单号" min-width="150">
                    <template #default="scope">
                        <el-tooltip :disabled="scope.row.flowType !== '赔付入账'" content="点击打开「贷记单」菜单并定位该单据" placement="top">
                            <span :class="scope.row.flowType === '赔付入账' ? 'bill-link' : ''" @click="openCreditBill(scope.row)">{{ scope.row.relatedNo }}</span>
                        </el-tooltip>
                    </template>
                </el-table-column>
            </el-table>
            <div class="pagination-area">
                <el-pagination background layout="total, prev, pager, next" :total="filteredFlows.length"></el-pagination>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        const app = createApp({
            setup() {
                const currencyMap = {
                    'CNY': { symbol: '¥', name: '人民币' },
                    'USD': { symbol: '$', name: '美元' },
                    'HKD': { symbol: 'HK$', name: '港币' },
                    'EUR': { symbol: '€', name: '欧元' }
                };
                const currencyOptions = ['CNY', 'USD', 'HKD', 'EUR'];
                const currencySymbol = (c) => currencyMap[c] ? currencyMap[c].symbol : c;
                const currencyName = (c) => currencyMap[c] ? currencyMap[c].name : c;
                const formatMoney = (val) => Number(val).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                const entities = ['广州飞点', '深圳飞点', '广东飞点', '香港富力顿', '墨链'];
                const flowTypes = ['充值', '充值退回', '提现', '收款核销', '收款核销撤销', '转汇', '赔付入账'];   // 「赔付入账」= 贷记单（负数账单）结转钱包；**结转即终态、没有对向的撤销流水**

                const searchForm = reactive({ customerName: '', entityName: '', currency: '', flowType: '', dateRange: [] });

                // 账户名称（= 钱包账号编号 + 币种代码）：按「客户 × 账户主体 × 币种」反查钱包，与「资金账户管理 → 客户资金账户」同一份数据
                // 本页是跨客户跨账户流水，必须标明是哪本账户
                const walletAccounts = {
                    '深圳市华美科技有限公司|广州飞点|CNY': '1000001 CNY',
                    '深圳市华美科技有限公司|广州飞点|USD': '1000002 USD',
                    '深圳市华美科技有限公司|深圳飞点|CNY': '1000003 CNY',
                    '深圳市华美科技有限公司|广东飞点|CNY': '1000008 CNY',
                    '深圳市华美科技有限公司|香港富力顿|HKD': '1000009 HKD',
                    '广州迅达贸易有限公司|广州飞点|CNY': '1000004 CNY',
                    '广州迅达贸易有限公司|香港富力顿|HKD': '1000005 HKD',
                    '东莞新锐电子有限公司|广东飞点|CNY': '1000006 CNY',
                    '东莞新锐电子有限公司|广东飞点|USD': '1000007 USD',
                    '东莞市宏泰五金制品有限公司|广东飞点|CNY': '1000010 CNY'
                };
                const accountNameOf = (row) => walletAccounts[`${row.customerName}|${row.entityName}|${row.currency}`] || '—';

                // 钱包余额（与「资金账户管理 → 客户资金账户」同值）：核销时校验够不够扣
                const walletBalances = reactive({
                    '深圳市华美科技有限公司|广州飞点|CNY': 3719.50,
                    '深圳市华美科技有限公司|广州飞点|USD': 1200.00,
                    '深圳市华美科技有限公司|深圳飞点|CNY': 3200.00,
                    '深圳市华美科技有限公司|广东飞点|CNY': 800.00,
                    '深圳市华美科技有限公司|香港富力顿|HKD': 15000.00,
                    '广州迅达贸易有限公司|广州飞点|CNY': 800.00,
                    '广州迅达贸易有限公司|香港富力顿|HKD': 25000.00,
                    '东莞新锐电子有限公司|广东飞点|CNY': 12000.00,
                    '东莞市宏泰五金制品有限公司|广东飞点|CNY': 5000.00,
                    '东莞新锐电子有限公司|广东飞点|USD': 0.00
                });
                const walletKeyOf = (row) => row.customerName + '|' + row.entityName + '|' + row.currency;

                const allFlows = reactive([
                    { time: '2026-09-07 09:00', customerName: '深圳市华美科技有限公司', entityName: '广东飞点', currency: 'CNY', flowType: '赔付入账', amount: 300.00, balanceAfter: 1100.00, operator: '财务-李伟', relatedNo: 'AR-GD-202608-00003', status: '正常' },
                    { time: '2026-08-27 10:25', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '充值', amount: 3000.00, balanceAfter: 3719.50, operator: '张珊', relatedNo: 'FD20260827001' },
                    { time: '2026-08-26 09:30', customerName: '广州迅达贸易有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '收款核销', amount: -719.50, balanceAfter: 800.00, operator: '李伟', relatedNo: 'WO20260826001' },
                    { time: '2026-08-25 14:12', customerName: '深圳市华美科技有限公司', entityName: '深圳飞点', currency: 'CNY', flowType: '充值', amount: 3200.00, balanceAfter: 3200.00, operator: '张珊', relatedNo: 'FD20260825003' },
                    { time: '2026-08-24 10:00', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'USD', flowType: '转汇', amount: 1200.00, balanceAfter: 1200.00, operator: '王强', relatedNo: 'TR20260824001' },
                    { time: '2026-08-24 10:00', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '转汇', amount: -8640.00, balanceAfter: 719.50, operator: '王强', relatedNo: 'TR20260824001' },
                    { time: '2026-08-24 09:50', customerName: '深圳市华美科技有限公司', entityName: '香港富力顿', currency: 'HKD', flowType: '充值', amount: 15000.00, balanceAfter: 15000.00, operator: '张珊', relatedNo: 'FD20260824003' },
                    { time: '2026-08-22 17:00', customerName: '广州迅达贸易有限公司', entityName: '香港富力顿', currency: 'HKD', flowType: '充值', amount: 25000.00, balanceAfter: 25000.00, operator: '张珊', relatedNo: 'FD20260822005' },
                    { time: '2026-08-20 11:00', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '提现', amount: -500.00, balanceAfter: 9359.50, operator: '李伟', relatedNo: 'WD20260820001' },
                    { time: '2026-08-15 10:00', customerName: '深圳市华美科技有限公司', entityName: '广东飞点', currency: 'CNY', flowType: '充值', amount: 800.00, balanceAfter: 800.00, operator: '张珊', relatedNo: 'FD20260815001' },
                    { time: '2026-07-20 11:00', customerName: '广州迅达贸易有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '收款核销', amount: -1500.00, balanceAfter: 1519.50, operator: '李伟', relatedNo: 'WO20260720001' },
                    { time: '2026-07-09 15:00', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '收款核销', amount: -700.00, balanceAfter: 9859.50, operator: '李伟', relatedNo: 'WO20260709001' },
                    { time: '2026-07-08 09:30', customerName: '广州迅达贸易有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '收款核销撤销', amount: 400.00, balanceAfter: 3019.50, operator: '李伟', relatedNo: 'WO20260708001' },
                    { time: '2026-07-06 14:00', customerName: '广州迅达贸易有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '收款核销', amount: -400.00, balanceAfter: 2619.50, operator: '李伟', relatedNo: 'WO20260706001' },
                    { time: '2026-06-05 10:00', customerName: '广州迅达贸易有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '收款核销', amount: -2800.00, balanceAfter: 3019.50, operator: '李伟', relatedNo: 'WO20260605001' },
                    { time: '2026-06-04 09:10', customerName: '广州迅达贸易有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '充值', amount: 2000.00, balanceAfter: 5819.50, operator: '张珊', relatedNo: 'FD20260604002' }
                ]);

                const filteredFlows = computed(() => {
                    let data = allFlows;
                    if (searchForm.customerName) data = data.filter(f => f.customerName.includes(searchForm.customerName));
                    if (searchForm.entityName) data = data.filter(f => f.entityName === searchForm.entityName);
                    if (searchForm.currency) data = data.filter(f => f.currency === searchForm.currency);
                    if (searchForm.flowType) data = data.filter(f => f.flowType === searchForm.flowType);
                    if (searchForm.dateRange && searchForm.dateRange.length === 2) {
                        const start = searchForm.dateRange[0];
                        const end = searchForm.dateRange[1];
                        data = data.filter(f => {
                            const d = f.time.substring(0, 10);
                            return d >= start && d <= end;
                        });
                    }
                    return data;
                });

                const flowTypeTag = (type) => {
                    const map = { '充值': 'success', '充值退回': 'info', '提现': 'warning', '收款核销': 'danger', '收款核销撤销': 'success', '转汇': 'primary', '赔付入账': 'success' };
                    return map[type] || 'info';
                };
                // 「赔付入账」（贷记单结转）**没有撤销动作**：钱进了客户可用额度就是终态 —— 它可能已被用来核销别的账单，
                // 反悔要靠"对冲凭证"而不是回滚流水：运单侧新增一条反向流水 → 下期账单里作为应收费抵扣。
                // 同理，一条已经发生的核销也不再从本页撤销（反核销在「核销记录」菜单）。
                const pad = (n) => String(n).padStart(2, '0');
                const nowStamp = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
                const searchExpanded = ref(false);
                // 「赔付入账」的关联单号 = 贷记单号 → 可点开「贷记单」菜单并定位该单据（两页互查：贷记单详情的时间线里反过来给出资金流水号）
                const openCreditBill = (row) => {
                    if (row.flowType !== '赔付入账') return;
                    window.open('财务_贷记单.html?billNo=' + encodeURIComponent(row.relatedNo), '_blank');
                };
                const handleExport = () => { ElMessage.warning('导出功能开发中，导出范围待确认'); };
                const handleSearch = () => { ElMessage.success('执行查询'); };
                const resetSearch = () => { searchForm.customerName = ''; searchForm.entityName = ''; searchForm.currency = ''; searchForm.flowType = ''; searchForm.dateRange = []; };

                return {
                    currencyOptions, entities, flowTypes,
                    currencySymbol, currencyName, formatMoney, accountNameOf,
                    searchForm, searchExpanded, filteredFlows, flowTypeTag,
                    handleExport, handleSearch, resetSearch, openCreditBill
                };
            }
        });

        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
