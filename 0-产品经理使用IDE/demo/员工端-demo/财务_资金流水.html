<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资金流水 - 员工端</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <style>
        :root { --el-color-primary: #2DA44E; --el-bg-color: #F5F7FA; --el-text-color-regular: #606266; --el-text-color-primary: #303133; }
        body { margin: 0; padding: 16px; background-color: var(--el-bg-color); font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif; font-size: 14px; color: var(--el-text-color-primary); }
        .content-card { background-color: #fff; border-radius: 4px; padding: 16px; height: calc(100vh - 32px); display: flex; flex-direction: column; box-sizing: border-box; }

        .search-area { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
        .btn-search-primary { background-color: #2DA44E !important; border-color: #2DA44E !important; color: #FFFFFF !important; }
        .btn-search-reset { background-color: #FFFFFF !important; border-color: #DCDFE6 !important; color: #000000 !important; }
        .el-table th.el-table__cell { background-color: #FAFAFA; color: #303133; font-weight: 500; }
        .pagination-area { margin-top: 16px; display: flex; justify-content: flex-end; }

        .amount-in { color: #67C23A; font-weight: 500; }
        .amount-out { color: #F56C6C; font-weight: 500; }
    </style>
</head>
<body>
    <div id="app">
        <div class="content-card">
            <div class="search-area">
                <el-input v-model="searchForm.customerName" placeholder="客户名称" clearable style="width: 200px;"></el-input>
                <el-select v-model="searchForm.entityName" placeholder="主体" clearable style="width: 140px;">
                    <el-option v-for="e in entities" :key="e" :label="e" :value="e"></el-option>
                </el-select>
                <el-select v-model="searchForm.currency" placeholder="币种" clearable style="width: 130px;">
                    <el-option v-for="c in currencyOptions" :key="c" :label="currencyName(c)" :value="c"></el-option>
                </el-select>
                <el-select v-model="searchForm.flowType" placeholder="流水类型" clearable style="width: 140px;">
                    <el-option v-for="t in flowTypes" :key="t" :label="t" :value="t"></el-option>
                </el-select>
                <el-date-picker
                    v-model="searchForm.dateRange"
                    type="daterange"
                    value-format="YYYY-MM-DD"
                    range-separator="至"
                    start-placeholder="开始日期"
                    end-placeholder="结束日期"
                    style="width: 260px;">
                </el-date-picker>
                <el-button class="btn-search-primary" @click="handleSearch">
                    <el-icon style="margin-right: 4px;"><Search /></el-icon>查询
                </el-button>
                <el-button class="btn-search-reset" @click="resetSearch">
                    <el-icon style="margin-right: 4px;"><RefreshRight /></el-icon>重置
                </el-button>
            </div>

            <el-table :data="filteredFlows" border style="width: 100%">
                <el-table-column prop="time" label="流水时间" min-width="150"></el-table-column>
                <el-table-column prop="customerName" label="客户" min-width="190" show-overflow-tooltip></el-table-column>
                <el-table-column prop="entityName" label="主体" min-width="110"></el-table-column>
                <el-table-column prop="currency" label="币种" min-width="80" align="center">
                    <template #default="scope">{{ currencyName(scope.row.currency) }}</template>
                </el-table-column>
                <el-table-column prop="flowType" label="流水类型" min-width="110" align="center">
                    <template #default="scope">
                        <el-tag :type="flowTypeTag(scope.row.flowType)" size="small">{{ scope.row.flowType }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="变动金额" min-width="120" align="right">
                    <template #default="scope">
                        <span :class="scope.row.amount >= 0 ? 'amount-in' : 'amount-out'">
                            {{ scope.row.amount >= 0 ? '+' : '' }}{{ currencySymbol(scope.row.currency) }}{{ formatMoney(scope.row.amount) }}
                        </span>
                    </template>
                </el-table-column>
                <el-table-column label="变动后余额" min-width="120" align="right">
                    <template #default="scope">{{ currencySymbol(scope.row.currency) }}{{ formatMoney(scope.row.balanceAfter) }}</template>
                </el-table-column>
                <el-table-column prop="operator" label="操作人" min-width="110"></el-table-column>
                <el-table-column prop="relatedNo" label="关联单号" min-width="150"></el-table-column>
            </el-table>
            <div class="pagination-area">
                <el-pagination background layout="total, prev, pager, next" :total="filteredFlows.length"></el-pagination>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed } = Vue;
        const { ElMessage } = ElementPlus;

        const app = createApp({
            setup() {
                const currencyMap = {
                    'CNY': { symbol: '¥', name: '人民币' },
                    'USD': { symbol: '$', name: '美元' },
                    'HKD': { symbol: 'HK$', name: '港币' },
                    'EUR': { symbol: '€', name: '欧元' }
                };
                const currencyOptions = ['CNY', 'USD', 'HKD', 'EUR'];
                const currencySymbol = (c) => currencyMap[c] ? currencyMap[c].symbol : c;
                const currencyName = (c) => currencyMap[c] ? currencyMap[c].name : c;
                const formatMoney = (val) => Number(val).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                const entities = ['广州飞点', '深圳飞点', '广东飞点', '香港富利顿', '墨链'];
                const flowTypes = ['充值', '充值退回', '提现', '账单核销', '账单核销撤销', '转汇'];

                const searchForm = reactive({ customerName: '', entityName: '', currency: '', flowType: '', dateRange: [] });

                const allFlows = [
                    { time: '2026-08-27 10:25', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '充值', amount: 5000.00, balanceAfter: 5000.00, operator: '张珊', relatedNo: 'FD20260827001' },
                    { time: '2026-08-27 09:10', customerName: '广州迅达贸易有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '充值', amount: 2000.00, balanceAfter: 5800.00, operator: '张珊', relatedNo: 'FD20260827002' },
                    { time: '2026-08-26 09:30', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '账单核销', amount: -1280.50, balanceAfter: 3719.50, operator: '李伟', relatedNo: 'WO20260826001' },
                    { time: '2026-08-25 14:12', customerName: '深圳市华美科技有限公司', entityName: '深圳飞点', currency: 'CNY', flowType: '充值', amount: 3200.00, balanceAfter: 3200.00, operator: '张珊', relatedNo: 'FD20260825003' },
                    { time: '2026-08-24 10:00', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'USD', flowType: '转汇', amount: 1200.00, balanceAfter: 1200.00, operator: '王强', relatedNo: 'TR20260824001' },
                    { time: '2026-08-24 10:00', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '转汇', amount: -8640.00, balanceAfter: 3719.50, operator: '王强', relatedNo: 'TR20260824001' },
                    { time: '2026-08-22 17:00', customerName: '广州迅达贸易有限公司', entityName: '香港富利顿', currency: 'HKD', flowType: '充值', amount: 25000.00, balanceAfter: 25000.00, operator: '张珊', relatedNo: 'FD20260822005' },
                    { time: '2026-08-20 11:00', customerName: '深圳市华美科技有限公司', entityName: '广州飞点', currency: 'CNY', flowType: '提现', amount: -500.00, balanceAfter: 4219.50, operator: '李伟', relatedNo: 'WD20260820001' }
                ];

                const filteredFlows = computed(() => {
                    let data = allFlows;
                    if (searchForm.customerName) data = data.filter(f => f.customerName.includes(searchForm.customerName));
                    if (searchForm.entityName) data = data.filter(f => f.entityName === searchForm.entityName);
                    if (searchForm.currency) data = data.filter(f => f.currency === searchForm.currency);
                    if (searchForm.flowType) data = data.filter(f => f.flowType === searchForm.flowType);
                    if (searchForm.dateRange && searchForm.dateRange.length === 2) {
                        const start = searchForm.dateRange[0];
                        const end = searchForm.dateRange[1];
                        data = data.filter(f => {
                            const d = f.time.substring(0, 10);
                            return d >= start && d <= end;
                        });
                    }
                    return data;
                });

                const flowTypeTag = (type) => {
                    const map = { '充值': 'success', '充值退回': 'info', '提现': 'warning', '账单核销': 'danger', '账单核销撤销': 'success', '转汇': 'primary' };
                    return map[type] || 'info';
                };
                const handleSearch = () => { ElMessage.success('执行查询'); };
                const resetSearch = () => { searchForm.customerName = ''; searchForm.entityName = ''; searchForm.currency = ''; searchForm.flowType = ''; searchForm.dateRange = []; };

                return {
                    currencyOptions, entities, flowTypes,
                    currencySymbol, currencyName, formatMoney,
                    searchForm, filteredFlows, flowTypeTag,
                    handleSearch, resetSearch
                };
            }
        });

        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
