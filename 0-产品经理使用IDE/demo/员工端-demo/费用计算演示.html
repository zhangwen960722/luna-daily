function calculate(p,rules){const sources=[],skipped=[],pending=[];const qty=p.unit==='KG'?p.weight:p.volume;
for(const dir of ['r','s'])sources.push({dir,feeLabel:'运费',unit:p.unit,currency:'CNY',price:p.price,qty,amount:round(p.price*qty),source:'公布价',name:'本周公布价',ruleId:'本周运价行'});
for(const r of rules){let hit=true;const row=r.row;
if(r.customer&&r.customer!==p.customer)hit=false;
if([7,8].includes(row)&&!(p.bubble>=251))hit=false;
if([10,12].includes(row)&&!p.selfDelivery)hit=false;
if([14,16,17].includes(row)&&p.customs!=='1010')hit=false;
if([18,19].includes(row)&&(!p.liquid||(row===18?p.special:p.special===false)))hit=false;
if([21,23].includes(row)&&!p.remote)hit=false;
if([25,27].includes(row)&&(p.lastMile!=='express'||p.address!=='commercial'))hit=false;
if([29,31].includes(row)&&(p.lastMile!=='express'||p.address!=='residential'))hit=false;
if(row===33&&!p.manual)hit=false;
if(row===35 && !(p.material>20||p.boxWeight>240))hit=false;
if(row===37&& !((p.length+p.width)*2+p.height>300||p.length+p.width*2+p.height*2>265))hit=false;
if(!hit)continue;
for(const l of r.lines){const unit=l.unit==='KG/m³'?p.unit:l.unit==='票'?'票':l.unit==='箱'?'箱':'数量';const q=unit==='KG'?p.weight:unit==='m³'?p.volume:unit==='票'?1:unit==='箱'?(row===35?Number(p.overweightBoxes||0):Number(p.oversizeBoxes||0)):p.count;
const item={...l,unit,qty:q,amount:round(l.price*q),source:'费用与标识规则',name:r.name,ruleId:r.id};
if(l.dir==='s'&&l.feeLabel==='运费'){skipped.push({...item,reason:'销售成本运费仅取本周公布价，排除规则运费明细'});continue;}sources.push(item);}}
const map=new Map();for(const s of sources){const key=[s.dir,s.feeLabel,s.unit,s.currency].join('|');if(!map.has(key))map.set(key,{dir:s.dir,feeLabel:s.feeLabel,unit:s.unit,currency:s.currency,price:0,qty:s.qty,amount:0,sources:[]});let g=map.get(key);g.price+=s.price;g.amount+=s.amount;g.sources.push(s);}
const merged=[...map.values()].map(g=>({...g,price:round(g.price),amount:round(g.amount)}));const rows=merged.filter(g=>g.amount!==0);return {sources,skipped,pending,rows,zeroCount:merged.length-rows.length,ar:round(rows.filter(r=>r.dir==='r').reduce((a,r)=>a+r.amount,0)),sales:round(rows.filter(r=>r.dir==='s').reduce((a,r)=>a+r.amount,0))};}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('inputs').innerHTML=fields.map(([id,label,type,options])=>'<label>'+label+(type==='select'?'<select id="'+id+'">'+options.map(v=>'<option value="'+esc(v)+'">'+esc(({truck:'卡派',express:'快递派',commercial:'商业地址',residential:'私人地址'})[v]||v)+'</option>').join('')+'</select>':'<input id="'+id+'" type="'+type+'" '+(type==='number'?'min="0" step="0.01"':'')+'>')+'</label>').join('');
const caseDescriptions=["仅配置应收单价优惠；重货优惠并入应收运费，销售成本运费取本周公布价。", "应收单价优惠、自送双方向优惠与报关费共同计算。", "应收运费优惠与公布价合并；销售成本运费保持公布价。", "运费、泡比、自送共同命中；偏远费正负抵消为零，不生成流水。", "正数运费调整并入应收运费，报关费按各方向明细生成。", "非空运、欧洲线、加拿大示例组合，液体附加费只生成应收。", "空运、欧洲线、加拿大示例组合，液体附加费生成应收和销售成本。", "积米商业地址减免与正向附加费抵消为零。", "积米私人地址减免抵消，费用类型沿用场景表配置。", "按输入的贴标数量，分别生成应收和销售成本贴标费。", "3箱命中超长，每箱150元，两个方向各生成450元超长费。", "按m³选择对应计价明细，同样合并并过滤零金额。", "3箱命中超重，每箱150元，两个方向各生成450元超重费。"];
document.getElementById('caseOptions').innerHTML=presets.map((p,i)=>'<button type="button" class="case-option" data-case="'+i+'"><strong>'+esc(p[0])+'</strong><span>'+esc(caseDescriptions[i])+'</span></button>').join('');
document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{document.getElementById('preset').value=b.dataset.case;document.getElementById('casePicker').open=false;load();});
function read(){return Object.fromEntries(fields.map(([id,l,t])=>[id,t==='checkbox'?document.getElementById(id).checked:t==='number'?Number(document.getElementById(id).value):document.getElementById(id).value]));}
function table(rows,cols){return rows.length?'<table><thead><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[1](r))+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p class="muted">无记录</p>';}
const cols=[['方向',r=>r.dir==='r'?'应收':'销售成本'],['费用类型',r=>r.feeLabel],['单位',r=>r.unit],['币种',r=>r.currency],['单价',r=>r.price.toFixed(2)],['计费量',r=>r.qty],['金额',r=>r.amount.toFixed(2)]];
function render(){const p=read();const x=calculate(p,RULES);document.getElementById('ar').textContent=x.ar.toFixed(2);document.getElementById('sales').textContent=x.sales.toFixed(2);document.getElementById('status').textContent='结果 '+x.rows.length+' 条 · '+x.zeroCount+' 组零金额已过滤';document.getElementById('result').innerHTML=table(x.rows,[...cols,['合并来源',r=>r.sources.map(s=>s.source+'：'+s.name).join('；')]]);document.getElementById('sources').innerHTML=table(x.sources,[['来源',r=>r.source],['规则名称',r=>r.name],...cols]);document.getElementById('skipped').innerHTML=table(x.skipped,[['名称',r=>r.name],...cols,['排除原因',r=>r.reason]]);document.getElementById('warnings').innerHTML=x.pending.map(t=>'<p class="note">'+esc(t)+'</p>').join('');}
function load(){const selected=Number(document.getElementById('preset').value);document.getElementById('caseTitle').textContent=presets[selected][0];document.getElementById('caseDescription').textContent=caseDescriptions[selected];document.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-selected',String(Number(b.dataset.case)===selected)));let p={...BASE,...presets[Number(document.getElementById('preset').value)][1]};for(const[id,l,t]of fields){const e=document.getElementById(id);if(t==='checkbox')e.checked=p[id];else e.value=p[id];}render();}
for(const[id]of fields)document.getElementById(id).addEventListener('input',render);document.getElementById('load').onclick=load;document.getElementById('preset').onchange=load;load();
</script></html>
